name: Build SyntropyOS

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      TC_VERSION: esp-14.2.0_20241119
      TC_FILE: xtensa-esp-elf-14.2.0_20241119-x86_64-linux-gnu.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install esptool
        run: pip install "esptool==4.8.1"

      - name: Cache Xtensa toolchain
        id: tccache
        uses: actions/cache@v6
        with:
          path: ~/xtensa-esp-elf
          key: xtensa-esp-elf-${{ env.TC_VERSION }}

      - name: Fetch Xtensa toolchain
        if: steps.tccache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME"
          curl -L -o tc.tar.xz "https://github.com/espressif/crosstool-NG/releases/download/${TC_VERSION}/${TC_FILE}"
          tar xf tc.tar.xz
          rm tc.tar.xz

      - name: Build
        run: |
          TC_BIN="$HOME/xtensa-esp-elf/bin"
          make all \
            TOOLCHAIN="$TC_BIN" \
            ESPTOOL="esptool.py"

      - name: Show output
        run: |
          TC_BIN="$HOME/xtensa-esp-elf/bin"
          "$TC_BIN/xtensa-esp32-elf-readelf" -h syntropyOS.elf | grep -E "Machine|Data|Class"
          "$TC_BIN/xtensa-esp32-elf-size" syntropyOS.elf || true
          ls -la syntropyOS.elf *.bin

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: SyntropyOS
          path: |
            syntropyOS.elf
            *.bin
          if-no-files-found: error

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SyntropyOS build ${{ github.run_number }}
          files: |
            *.bin
            syntropyOS.elf
          fail_on_unmatched_files: true
