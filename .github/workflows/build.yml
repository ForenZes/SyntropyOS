name: Build SyntropyOS

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TC_VERSION: esp-14.2.0_20241119
      TC_FILE: xtensa-esp-elf-14.2.0_20241119-x86_64-linux-gnu.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install esptool
        run: pip install esptool

      - name: Cache Xtensa toolchain
        id: tccache
        uses: actions/cache@v4
        with:
          path: ~/xtensa-esp-elf
          key: xtensa-esp-elf-${{ env.TC_VERSION }}

      - name: Fetch Xtensa toolchain
        if: steps.tccache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME"
          curl -L -o tc.tar.xz "https://github.com/espressif/crosstool-NG/releases/download/${TC_VERSION}/${TC_FILE}"
          tar xf tc.tar.xz
          rm tc.tar.xz

      - name: Build
        run: |
          TC_BIN="$HOME/xtensa-esp-elf/bin"
          make all \
            TOOLCHAIN="$TC_BIN" \
            CC="$TC_BIN/xtensa-esp-elf-gcc" \
            ESPTOOL="esptool.py"

      - name: Show output
        run: |
          ls -la app.elf app.bin
          "$HOME/xtensa-esp-elf/bin/xtensa-esp-elf-size" app.elf || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SyntropyOS
          path: |
            app.elf
            app.bin
          if-no-files-found: error
